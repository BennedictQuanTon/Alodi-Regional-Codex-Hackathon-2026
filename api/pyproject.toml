[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alodi-api"
version = "0.1.0"
description = "Alodi local application backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alodi-ai",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
alodi-api = "app.cli:serve"
alodi-db = "app.db.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv.sources]
alodi-ai = { path = "../ai", editable = true }

[tool.setuptools.package-data]
"app.db.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
